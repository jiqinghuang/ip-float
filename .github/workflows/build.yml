name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          suppress-deprecation-warnings: msystem-mingw64

      - name: Build and test
        shell: pwsh
        run: ./src/build.ps1 -MingwBin "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" -OutDir dist -Test -Werror

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ip-float-windows
          path: dist/ip-float.exe
          if-no-files-found: error
