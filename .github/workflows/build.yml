name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          suppress-deprecation-warnings: msystem-mingw64

      - name: Build
        shell: pwsh
        run: ./src/build.ps1 -MingwBin "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" -OutDir dist -Werror

      # 单测放在 MSYS2 shell 里跑：PowerShell 直接调用 MSYS2 的 g++ 在 runner 上
      # 会出现 exit 1 且没有任何诊断（进程/流处理差异），bash 下输出完整可查。
      - name: Unit tests
        shell: msys2 {0}
        run: |
          g++ --version | head -1
          g++ -std=gnu++17 -O2 -DUNICODE -D_UNICODE -Wall -Wextra -Werror \
            -o dist/test_ipinfo.exe \
            tests/test_ipinfo.cpp src/ipinfo.cpp src/util.cpp \
            -lgdi32 -luser32 -lshell32
          ./dist/test_ipinfo.exe
          g++ -std=gnu++17 -O2 -DUNICODE -D_UNICODE -Wall -Wextra -Werror \
            -o dist/test_probe.exe \
            tests/test_probe.cpp src/probe.cpp src/util.cpp \
            -lgdi32 -luser32 -lshell32
          ./dist/test_probe.exe

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ip-float-windows
          path: dist/ip-float.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download built exe
        uses: actions/download-artifact@v4
        with:
          name: ip-float-windows
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ip-float.exe
          generate_release_notes: true
